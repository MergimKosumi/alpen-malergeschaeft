name: Notify IndexNow after Pages deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the published revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate live ownership and notify IndexNow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/indexnow.py --wait-for-deploy "${{ github.sha }}"
